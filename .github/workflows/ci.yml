name: CI

on:
  pull_request:
    branches: [main]
  # Build on merges to main so the branch-scoped compile cache is populated on the
  # default branch. A pull request reads only its own branch's cache and main's, so
  # without a main build every pull request starts from a cold cache.
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  # The caller job id is the middle segment of every reusable-workflow status
  # check name (`CI / swift / build`).
  swift:
    uses: agoodkind/swift-makefile/.github/workflows/_ci.yml@main
    with:
      runner: macos-26
      brew-packages: ccache cmake
      setup-target: preflight
      make-args: "CONFIG=Release"
      # build signs the CLI binaries + MLX bundle via SWIFT_MK_SIGN_* (Makefile).
      import-signing-cert: true
      # The identity and team come from repository variables, so rotating a
      # certificate or moving teams is one settings edit rather than a commit in
      # every repository. Each certificate keeps its own variable because a
      # release signs Developer ID while an unregistered CI runner signs Apple
      # Distribution, and one shared slot for both was a defect once already.
      signing-identity-name: ${{ vars.APPLE_DEVELOPER_ID_IDENTITY }}
      apple-team-id: ${{ vars.APPLE_TEAM_ID }}
      extra-cache-paths: |
        .build
        Tuist/.build
        Derived
        Products/Build
        ~/Library/Caches/org.swift.swiftpm
        ~/Library/Caches/ccache
    secrets: inherit
